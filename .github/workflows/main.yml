on:
  push:
    branches:
      - master
      - topic/fix_ci
  pull_request:
name: Build
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - run: sudo apt install -y protobuf-compiler
      - uses: actions/checkout@v2
        with:
          path: protobuf
      - uses: actions/checkout@v2
        with:
          repository: protocolbuffers/protobuf
          path: google
      - uses: alire-project/setup-alire@v5
      - uses: actions/cache@v4
        with:
          path: google_cache
          key: ${{ runner.os }}-v1
      - name: Build project
        run: alr -C protobuf build
      - name: Run tests
        run: alr -C protobuf exec make check
      - name: Run demo
        run: alr -C protobuf/demo run
  prove:
    runs-on: ubuntu-latest
    name: Prove SPARK output
    steps:
      - run: sudo apt install -y protobuf-compiler
      - uses: actions/checkout@v2
        with:
          path: protobuf
      - uses: alire-project/setup-alire@v5
      - name: Install gnatprove
        run: |
          alr -n install gnatprove
          echo "$HOME/.alire/bin" >> $GITHUB_PATH
      - name: Build project
        run: alr -C protobuf build
      - name: Prove the SPARK runtime
        run: alr -C protobuf exec -- make prove-spark
      - name: Install Python protobuf for the differential tests
        run: |
          python3 -m venv "$HOME/pb-venv"
          "$HOME/pb-venv/bin/pip" install protobuf
      - name: Prove, round-trip and differential SPARK output tests
        run: >-
          alr -C protobuf exec -- env REQUIRE_PROOF=1 DIFFERENTIAL=200
          PYTHON="$HOME/pb-venv/bin/python" ./testsuite_spark/run_all.sh
